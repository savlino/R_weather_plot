name: Fetch AEMET observations

on:
  schedule:
    # Every 6 hours; the station endpoint exposes a ~12 h window, so this
    # overlaps enough to survive a skipped run without losing data.
    - cron: "5 */6 * * *"
  workflow_dispatch:

concurrency:
  group: aemet-feed
  cancel-in-progress: false

# GITHUB_TOKEN only needs to read; the push is authenticated with FEED_PUSH_TOKEN.
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      R2_ENABLED: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' && secrets.R2_BUCKET != '' }}
    steps:
      # Checking out with the PAT leaves it as the origin credential, so the
      # push below is attributed to a user. Pushes by github-actions[bot] do
      # not count as repository activity, and public repos have their
      # scheduled workflows disabled after 60 days without any.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.FEED_PUSH_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::DBI
            any::RSQLite

      - name: Require Cloudflare R2 configuration
        if: ${{ env.R2_ENABLED != 'true' }}
        run: |
          echo "R2 secrets are required after the SQLite migration."
          exit 1

      - name: Restore SQLite snapshot from Cloudflare R2
        if: ${{ env.R2_ENABLED == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          aws s3 cp
          s3://${R2_BUCKET}/snapshots/weather.sqlite
          data/weather.sqlite
          --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com

      - name: Fetch observations
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: Rscript scripts/fetch.R

      - name: Update feed statistics
        run: Rscript scripts/update_stats.R

      - name: Mirror SQLite snapshot to Cloudflare R2
        if: ${{ env.R2_ENABLED == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          aws s3 cp data/weather.sqlite
          s3://${R2_BUCKET}/snapshots/weather.sqlite
          --endpoint-url https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com

      - name: Commit updated feed
        run: |
          git config user.name "savlino"
          git config user.email "savlino@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No new observations."
            exit 0
          fi
          git commit -m "data: AEMET observations $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
