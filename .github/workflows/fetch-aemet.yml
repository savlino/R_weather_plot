name: Fetch AEMET observations

on:
  schedule:
    # Every 6 hours; the station endpoint exposes a ~12 h window, so this
    # overlaps enough to survive a skipped run without losing data.
    - cron: "5 */6 * * *"
  workflow_dispatch:

concurrency:
  group: aemet-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::DBI
            any::RSQLite

      - name: Fetch observations
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          # CASTRO URDIALES-EDAR (Cantabria); space/comma separated for more.
          AEMET_STATIONS: "1083L"
        run: Rscript scripts/fetch.R

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.sqlite
          if git diff --staged --quiet; then
            echo "No new observations."
            exit 0
          fi
          git commit -m "data: AEMET observations $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
