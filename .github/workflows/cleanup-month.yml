name: Clean up completed weather month

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Completed calendar year, for example 2026"
        required: true
        type: string
      month:
        description: "Completed calendar month, 1-12"
        required: true
        type: string
      dry_run:
        description: "Report and render only; do not delete"
        required: true
        default: true
        type: boolean

concurrency:
  group: aemet-cleanup
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.FEED_PUSH_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::cpp11
            any::RSQLite
            any::dplyr
            any::lubridate
            any::reshape2
            any::pheatmap

      - name: Restore SQLite snapshot from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >-
          aws s3 cp
          s3://${R2_BUCKET}/snapshots/weather.sqlite
          data/weather.sqlite
          --endpoint-url ${R2_ENDPOINT}

      - name: Format year and month
        id: fmt
        run: |
          printf 'year=%04d\n' "${{ inputs.year }}" >> "$GITHUB_OUTPUT"
          printf 'month=%02d\n' "${{ inputs.month }}" >> "$GITHUB_OUTPUT"

      - name: Render and clean up month
        env:
          WEATHER_DB: data/weather.sqlite
        run: >-
          Rscript scripts/cleanup_month.R
          ${{ inputs.year }} ${{ inputs.month }} ${{ inputs.dry_run }}

      - name: Upload dry-run preview
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: heatmap-review-${{ steps.fmt.outputs.year }}-${{ steps.fmt.outputs.month }}
          path: plots/aemet-${{ steps.fmt.outputs.year }}-${{ steps.fmt.outputs.month }}.png
          retention-days: 14

      - name: Upload reviewed heatmap to R2
        if: ${{ inputs.dry_run == false }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >-
          aws s3 cp
          plots/aemet-${{ steps.fmt.outputs.year }}-${{ steps.fmt.outputs.month }}.png
          s3://${R2_BUCKET}/heatmaps/${{ steps.fmt.outputs.year }}-${{ steps.fmt.outputs.month }}/heatmap.png
          --endpoint-url ${R2_ENDPOINT}

      - name: Update feed statistics
        if: ${{ inputs.dry_run == false }}
        run: Rscript scripts/update_stats.R

      - name: Upload reduced SQLite snapshot to R2
        if: ${{ inputs.dry_run == false }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: >-
          aws s3 cp data/weather.sqlite
          s3://${R2_BUCKET}/snapshots/weather.sqlite
          --endpoint-url ${R2_ENDPOINT}

      - name: Commit reviewed PNG and stats
        if: ${{ inputs.dry_run == false }}
        env:
          GIT_TOKEN: ${{ secrets.FEED_PUSH_TOKEN }}
        run: |
          git config user.name "savlino"
          git config user.email "savlino@users.noreply.github.com"
          git add README.md plots/aemet-${{ steps.fmt.outputs.year }}-${{ steps.fmt.outputs.month }}.png
          git commit -m "cleanup: weather observations ${{ steps.fmt.outputs.year }}-${{ steps.fmt.outputs.month }}" || echo "No Git changes to commit."
          git pull --rebase --autostash
          git push
